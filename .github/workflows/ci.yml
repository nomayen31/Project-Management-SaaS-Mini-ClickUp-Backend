name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: taskflow_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Configure the isolated database
        env:
          POSTGRES_TEST_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          url="postgresql://taskflow:ci-only@127.0.0.1:$POSTGRES_TEST_PORT/taskflow_test"
          echo "DIRECT_URL=$url" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=$url" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:migrate:deploy
      - run: npm run db:migrate:status
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
